# Single source of truth for the project. Scripts read from here so we change
# settings in one place

paths:
  beir_dir: data/beir
  uia_raw_dir: data/uia_raw
  uia_clean_dir: data/uia_clean
  index_dir: indexes

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64
  normalize: true   # we use cosine via inner product on normalized vectors

chunking:
  size: 256          # tokens (approx, we use char-based with ~4 chars/token)
  overlap: 32

retrieval:
  top_k: 5
  rerank: false
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

generator:
  provider: ollama
  model: llama3.2:3b-instruct-q4_K_M
  temperature: 0.0
  num_ctx: 4096

beir:
  dataset: nq
  corpus_subset_size: 20000   # cap for CPU; sampled to keep all qrel docs
  query_subset_size: 200
  metrics_k: [1, 3, 5, 10]

finetune:
  max_pairs: 5000
  epochs: 2
  batch_size: 16
  warmup_steps: 100
  output_subdir: minilm-nq-ft 

uia:
  # Verified entry points on www.uia.no (April 2026). The first is the
  # English programmes index; the others jump straight into the ICT-related
  # master programmes
  seed_urls:
    - https://www.uia.no/english/studies/programmes/
    - https://www.uia.no/english/studies/programmes/artificial-intelligence-and-internet-of-things-master/
    - https://www.uia.no/english/studies/programmes/cybersecurity-management-master/
    - https://www.uia.no/english/studies/
  allowed_domains:
    - uia.no
  # URL substring allowlist. A page is followed only if its URL contains
  # at least one of these. Tuned to ICT/CS-relevant slugs while filtering
  # out unrelated programmes (literature, history, etc.).
  url_must_contain:
    - ikt
    - ict
    - cybersecurity
    - artificial-intelligence
    - internet-of-things
    - information-system
    - informasjonssystem
    - informatics
    - computer
    - data-ingenior
    - engineering
    - mechatronics
  max_pages: 300
  request_delay_seconds: 1.0
  user_agent: "IKT469-RAG-research/0.1 (educational; contact: bakken0@gmail.com)"
